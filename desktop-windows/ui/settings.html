<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HomeAssistant Applet Settings</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="settings">
  <main>
    <section>
      <h2>Home Assistant</h2>
      <div class="row">
        <label for="url">URL</label>
        <div class="field"><input id="url" type="text" placeholder="http://homeassistant.local:8123" autocomplete="off" spellcheck="false"></div>
      </div>
      <div class="row">
        <label for="token">Long-lived access token</label>
        <div class="secret">
          <div class="field"><input id="token" type="password" placeholder="Token" autocomplete="off" spellcheck="false"></div>
          <button id="reveal" class="btn" type="button">Show</button>
        </div>
      </div>
    </section>
    <p class="caption">The token is stored in Windows Credential Manager, not in the config file.</p>

    <section>
      <h2>Panel filters</h2>
      <div class="row">
        <label for="light_label">Light label</label>
        <div class="field"><input id="light_label" type="text" placeholder="all lights" autocomplete="off" spellcheck="false"></div>
      </div>
      <div class="row">
        <label for="switch_label">Switch label</label>
        <div class="field"><input id="switch_label" type="text" placeholder="all switches" autocomplete="off" spellcheck="false"></div>
      </div>
      <div class="row">
        <label for="climate_label">Climate label</label>
        <div class="field"><input id="climate_label" type="text" placeholder="all thermostats" autocomplete="off" spellcheck="false"></div>
      </div>
    </section>
    <p class="caption">Only entities carrying the given Home Assistant label are shown. Leave a label empty to show everything.</p>

    <section>
      <h2>Windows</h2>
      <div class="row">
        <label for="autostart">Start with Windows</label>
        <label class="switch"><input id="autostart" type="checkbox"><span class="track"></span></label>
      </div>
    </section>

    <p id="error" class="error" hidden></p>
  </main>
  <script src="settings.js"></script>
</body>
</html>
