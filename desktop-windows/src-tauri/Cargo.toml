[package]
name = "ha-rooms"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = "2"

[dependencies]
ha-core = { path = "../../core" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = "4"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

# Standalone workspace: this crate must not be built together with the Linux/COSMIC members.
[workspace]

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
